<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모작 · 김대현</title>
<style>
*{box-sizing:border-box}
/* 여백은 화면 폭을 따라간다. 좁은 화면에서 28px, 넓은 화면에서 72px */
body{font-size:12px;line-height:1.7;margin:0;padding:clamp(28px,4.6vw,72px);
     min-height:100dvh;display:flex;flex-direction:column}
h2{font-size:inherit;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:baseline;
     gap:16px;margin:0 0 18px}
/* 방문 후에도 안 바뀐다. :visited 를 같이 써야 UA 기본값을 덮는다 */
a,a:visited{color:#960018;text-decoration:none}
/* 카민. 기본 검정 글자는 이 위에서 2.3:1 이므로 선택 글자색도 같이 잡는다 */
::selection{background:#960018;color:#fff}
ul{list-style:none;padding:0;margin:0;
   display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
   gap:clamp(34px,4vw,60px) clamp(28px,3.2vw,48px)}
img{display:block;width:100%;height:auto;margin-bottom:11px;
    filter:grayscale(1) contrast(1.18);transition:filter .2s;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
a:hover img,a:focus-visible img{filter:none}
/* 작업 캡션은 기본 검정, 올리면 카민. 썸네일 흑백->컬러와 같이 움직인다.
   :visited 는 (0,1,2) 라 ul a (0,0,2) 를 이기므로 함께 적어야 한다 */
ul a,ul a:visited{color:inherit}
ul a:hover,ul a:focus-visible{color:#960018}
.qrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
      margin:0 0 clamp(36px,5vw,68px)}
.q{margin:0;max-width:34ch;font-size:13.5px;line-height:1.5}
.sort{display:flex;gap:14px;margin:0;flex:none}
.sort button{padding:0;font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sort button[aria-pressed="true"]{color:#960018}
.q cite{display:block;font-style:normal;margin-top:3px}
nav{margin-top:auto;padding-top:clamp(56px,7vw,96px);
    display:flex;gap:20px;justify-content:center}
nav a,nav b{font-weight:400}
/* 현재 보는 곳만 카민. 나머지는 검정. 배경 없음.
   nav a:visited 는 (0,1,2) 라 nav a (0,0,2) 를 이기므로 함께 지정 */
nav a,nav a:visited{color:inherit}
nav b{color:#960018}
@media (prefers-reduced-motion:reduce){img{transition:none}}
</style>
</head>
<body>
<p class="top"><span>김대현</span><a href="mailto:dinored960018@gmail.com">dinored960018@gmail.com</a></p>
<div class="qrow">
<blockquote class="q">Art is to be free. Design is to fix<cite>Ye</cite></blockquote>
<p class="sort"><button type="button" data-sort="old" aria-pressed="false">old</button><button type="button" data-sort="new" aria-pressed="true">new</button></p>
</div>

<li data-num="260922"><a href="w/2026-W39-clone-02-lxl-creative/"><img src="w/2026-W39-clone-02-lxl-creative/thumb.png" alt="" loading="lazy" draggable="false" width="720" height="450">260922 LxL Creative</a></li>
<li data-num="260922"><a href="w/2026-W39-clone-01-white-desert/"><img src="w/2026-W39-clone-01-white-desert/thumb.png" alt="" loading="lazy" draggable="false" width="720" height="450">260922 White Desert</a></li>
</ul>
<nav aria-label="분류"><b aria-current="page">모작</b><a href="original/">창작</a></nav>
<script>
/* 정렬 토글. 목록 순서만 바꾼다. 서버도 저장소도 쓰지 않는다. */
(function(){
  var ul=document.querySelector("ul"),
      btns=[].slice.call(document.querySelectorAll(".sort button"));
  if(!ul||!btns.length)return;
  var base=[].slice.call(ul.children);            /* 최초 순서 = 최신순 */
  btns.forEach(function(b){
    b.addEventListener("click",function(){
      var old=b.dataset.sort==="old";
      btns.forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});
      (old?base.slice().reverse():base).forEach(function(li){ul.appendChild(li);});
    });
  });
})();
</script>
</body>
</html>
