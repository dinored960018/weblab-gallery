<style>
body{font-size:12px;line-height:1.7;margin:24px;
     min-height:calc(100dvh - 48px);display:flex;flex-direction:column}
h2{font-size:inherit;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:baseline;
     gap:16px;margin:0 0 24px}
/* 방문 후에도 안 바뀐다. :visited 를 같이 써야 UA 기본값을 덮는다 */
a,a:visited{color:#960018;text-decoration:none}
/* 카민. 기본 검정 글자는 이 위에서 2.3:1 이므로 선택 글자색도 같이 잡는다 */
::selection{background:#960018;color:#fff}
ul{list-style:none;padding:0;margin:0;
   display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
img{display:block;width:100%;height:auto;margin-bottom:6px;
    filter:grayscale(1) contrast(1.18);transition:filter .2s;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
a:hover img,a:focus-visible img{filter:none}
/* 작업 캡션은 기본 검정, 올리면 카민. 썸네일 흑백->컬러와 같이 움직인다.
   :visited 는 (0,1,2) 라 ul a (0,0,2) 를 이기므로 함께 적어야 한다 */
ul a,ul a:visited{color:inherit}
ul a:hover,ul a:focus-visible{color:#960018}
nav{display:flex;gap:14px;justify-content:center;margin-top:auto;padding-top:52px}
nav a,nav b{font-weight:400}
/* 현재 위치는 드래그한 것처럼. ::selection 과 같은 카민을 쓴다 */
nav b{background:#960018;color:#fff;padding:1px 3px}
@media (prefers-reduced-motion:reduce){img{transition:none}}
</style>
