<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>문서 · company.dreamventures.kr</title>
<style>
*{box-sizing:border-box}
body{font-size:14px;line-height:1.75;margin:0;padding:clamp(28px,4.6vw,72px);word-break:keep-all;overflow-wrap:break-word}
a,a:visited{color:#960018;text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:#960018;color:#fff}
.top{font-size:12px;display:flex;justify-content:space-between;gap:16px;margin:0 0 40px}
.top a,.top a:visited{color:inherit}
article{max-width:880px}
h1{font-size:24px;line-height:1.3;margin:0 0 24px}
h2{font-size:18px;margin:44px 0 12px;padding-top:14px;border-top:1px solid #111}
h3{font-size:15px;margin:28px 0 8px}
table{border-collapse:collapse;margin:12px 0;font-size:13px;display:block;overflow-x:auto;max-width:100%}
th,td{border-bottom:1px solid #ddd;padding:6px 10px;text-align:left;vertical-align:top}
th{border-bottom-color:#111;white-space:nowrap}
code{font-size:12.5px;background:#f2f2f2;padding:1px 4px}
pre{background:#f6f6f6;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.6}
pre code{background:none;padding:0}
blockquote{margin:12px 0;padding:2px 0 2px 14px;border-left:2px solid #111}
hr{border:0;border-top:1px solid #ddd;margin:32px 0}
.err{color:#960018}
</style>
</head>
<body>
<p class="top"><a href="./">문서 목록</a><span id="path"></span></p>
<article id="doc">불러오는 중</article>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.4/marked.min.js"></script>
<script>
(function(){
  var f=new URLSearchParams(location.search).get("f")||"";
  var doc=document.getElementById("doc");
  document.getElementById("path").textContent=f;
  if(!/^[\w\-./]+\.md$/.test(f)||f.indexOf("..")>-1){doc.innerHTML='<p class="err">문서 경로 오류</p>';return;}
  var dir=f.split("/").slice(0,-1);
  function resolve(rel){
    var parts=dir.slice();
    rel.split("/").forEach(function(p){ if(p===".."){parts.pop();} else if(p&&p!=="."){parts.push(p);} });
    return parts.join("/");
  }
  function slug(t){return t.trim().toLowerCase().replace(/[^\w\s\-\uAC00-\uD7A3]/g,"").replace(/\s/g,"-");}
  fetch("md/"+f).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }).then(function(md){
    doc.innerHTML=marked.parse(md);
    var h1=doc.querySelector("h1"); if(h1) document.title=h1.textContent+" · 문서";
    doc.querySelectorAll("h1,h2,h3,h4").forEach(function(h){ h.id=slug(h.textContent); });
    doc.querySelectorAll("a[href]").forEach(function(a){
      var h=a.getAttribute("href");
      if(/^(https?:|mailto:|#)/.test(h)) return;
      var m=h.match(/^([^#]+\.md)(#.*)?$/);
      if(m){ a.href="view.html?f="+encodeURI(resolve(m[1]))+(m[2]||""); }
    });
    if(location.hash){ var t=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(t) t.scrollIntoView(); }
  }).catch(function(e){ doc.innerHTML='<p class="err">문서를 불러오지 못함 ('+e.message+')</p>'; });
})();
</script>
</body>
</html>
